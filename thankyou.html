<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1c1c1e;
            padding: 50px 30px;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            text-align: center;
        }
        .logo {
            width: 70px;
            margin-bottom: 20px;
        }
        .title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8e8e93;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 6px;
        }
        .highlight {
            color: #0088cc;
        }
        .loader {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .loader span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #0088cc;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loader span:nth-child(1) { animation-delay: -0.32s; }
        .loader span:nth-child(2) { animation-delay: -0.16s; }
        .loader span:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .footer {
            margin-top: 28px;
            color: #636366;
            font-size: 13px;
        }
        .footer a {
            color: #0088cc;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://telegram.org/img/t_logo.png" class="logo" alt="Telegram">
        <div class="title">✅ تأیید شد</div>
        <div class="subtitle">
            از توجه شما به امنیت حسابتان سپاسگزاریم.
        </div>
        <div class="subtitle" style="color: #636366; font-size: 14px;">
            در حال بررسی اطلاعات شما هستیم...<br>
            لطفاً <span class="highlight">چند دقیقه</span> صبر کنید.
        </div>
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="footer">
            <a href="#">Telegram</a> • <a href="#">Support</a>
        </div>
    </div>
</body>
</html>
